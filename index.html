<script type="text/babel">
const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;
const { useState, useEffect, useRef } = React;

/* --- PRELOADER --- */
function Preloader({finish}){
  const [progress, setProgress] = useState(0);
  useEffect(()=>{
    const start = performance.now();
    function tick(now){
      const elapsed = now - start;
      const value = Math.min(100, (elapsed/2000)*100);
      setProgress(value);
      if(elapsed < 2400) requestAnimationFrame(tick);
      else finish();
    }
    requestAnimationFrame(tick);
  },[]);

  return(
    <motion.div
      initial={{opacity:1}} animate={{opacity:progress >= 100 ? 0 : 1}} transition={{duration:0.8}}
      className="fixed inset-0 z-[10000] bg-[#0d0904] flex items-center justify-center"
    >
      <div className="w-[260px] md:w-[380px]">
        <div className="text-center">
          <div className="text-[9px] tracking-[.5em] text-[#D4AF37]">SKIN · HAIR · BEAUTY</div>
          <div className="font-display text-2xl md:text-4xl tracking-[.18em] mt-4 gold">CLINIC</div>
        </div>
        <div className="h-[1px] bg-white/10 mt-12 overflow-hidden relative">
          <motion.div className="absolute top-0 left-0 h-full bg-[#D4AF37]" style={{width:`${progress}%`}} />
        </div>
        <div className="flex justify-between mt-3 text-[8px] tracking-[.3em] text-white/30">
          <span>EST. 2007 · 19 YEARS EXPERIENCE</span>
          <span>{Math.floor(progress)}%</span>
        </div>
      </div>
    </motion.div>
  );
}

/* --- CURSOR --- */
function Cursor(){
  useEffect(()=>{
    if(window.innerWidth < 768) return;
    const ring = document.querySelector(".cursor");
    const dot = document.querySelector(".cursor-dot");
    const move = e => {
      ring.style.left = e.clientX+"px"; ring.style.top = e.clientY+"px";
      dot.style.left = e.clientX+"px"; dot.style.top = e.clientY+"px";
    };
    window.addEventListener("mousemove", move);
    document.querySelectorAll("a, button, select, input, textarea").forEach(el=>{
      el.addEventListener("mouseenter", ()=> {
        ring.style.width="54px"; ring.style.height="54px"; ring.style.background="rgba(212,175,55,0.15)";
      });
      el.addEventListener("mouseleave", ()=> {
        ring.style.width="30px"; ring.style.height="30px"; ring.style.background="transparent";
      });
    });
    return ()=> window.removeEventListener("mousemove", move);
  },[]);
  return(
    <><div className="cursor"/><div className="cursor-dot"/></>
  );
}

/* --- NAVBAR --- */
function Navbar(){
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const handleScroll = () => setScrolled(window.scrollY > 50);
    window.addEventListener("scroll", handleScroll);
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const nav=[
    ["01","PHILOSOPHY","#philosophy"],
    ["02","SERVICES","#procedures"],
    ["03","FACILITIES","#approach"],
    ["04","CONTACT","#contact"]
  ];

  return(
    <>
      <motion.header
        initial={{y:-30, opacity:0}} animate={{y:0, opacity:1}} transition={{delay:2.5, duration:1}}
        className={`fixed top-0 left-0 right-0 z-[100] px-5 md:px-10 lg:px-14 py-5 transition-all duration-500 ${scrolled ? 'bg-[#0d0904]/90 backdrop-blur-md border-b border-white/5 py-4' : ''}`}
      >
        <div className="max-w-[1700px] mx-auto flex items-center justify-between">
          <a href="#" className="flex items-center gap-3 group">
            <div className="w-9 h-9 md:w-11 md:h-11 border border-[#D4AF37]/50 rounded-full flex items-center justify-center group-hover:border-[#D4AF37] transition duration-500">
              <span className="font-display text-[10px] md:text-[11px] text-[#D4AF37]">SHB</span>
            </div>
            <div className="hidden sm:block">
              <div className="font-display text-[11px] tracking-[.18em] text-white">SKIN HAIR BEAUTY</div>
              <div className="text-[7px] tracking-[.35em] text-[#D4AF37] mt-1">DR. AKHILESH KUMAR</div>
            </div>
          </a>

          <nav className="hidden lg:flex items-center gap-10">
            {nav.map(([num,name,href])=>(
              <a key={name} href={href} className="text-[9px] tracking-[.3em] text-white/70 hover:text-[#D4AF37] transition duration-500 flex items-center gap-2">
                <span className="text-[#D4AF37]/70 text-[7px]">{num}</span> {name}
              </a>
            ))}
          </nav>

          <a href="#contact" className="hidden md:block border border-[#D4AF37]/40 px-6 py-3 text-[8px] tracking-[.3em] hover:bg-[#D4AF37] hover:text-[#0d0904] transition duration-500 font-medium">
            BOOK CONSULTATION
          </a>

          <button onClick={()=>setOpen(!open)} className="lg:hidden text-[#D4AF37] text-3xl z-[101]">
            {open ? "✕" : "☰"}
          </button>
        </div>
      </motion.header>

      <AnimatePresence>
        {open &&(
          <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="mobile-menu fixed inset-0 z-[90] flex flex-col justify-center px-8">
            {nav.map(([num,name,href],i)=>(
              <motion.a key={name} href={href} onClick={()=>setOpen(false)} initial={{x:-30,opacity:0}} animate={{x:0,opacity:1}} transition={{delay:i*0.1}} className="py-7 border-b border-white/10 flex justify-between items-center">
                <span className="font-display text-2xl md:text-3xl gold">{name}</span>
                <span className="text-[#D4AF37]/50 text-xs">{num}</span>
              </motion.a>
            ))}
          </motion.div>
        )}
      </AnimatePresence>
    </>
  );
}
